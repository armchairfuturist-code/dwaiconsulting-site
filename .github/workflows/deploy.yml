name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Content is in sync with markdown
        run: node scripts/content.mjs check
      - name: Check deploy credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set. Deploy skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.ready == 'true'
        run: bash scripts/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 86a92d3f5ed4b3313381515ca4208ae7
          # Temporary host. Canonicals self-reference workers.dev until the
          # dwaiconsulting.com cutover, which sets this to the real domain.
          SITE_URL: https://dwaiconsulting-site.armchairfuturist.workers.dev
